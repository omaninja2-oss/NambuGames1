name: Mobile browser regression
on:
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic browser harness
        shell: python
        run: |
          from pathlib import Path
          g=Path("game.js").read_text()
          g=g.rsplit("})();",1)[0]+'window.__TEST__={step:dt=>update(dt),pos:()=>({x:pl.x,y:pl.y}),touch:()=>({...touchInput}),keys:()=>({...K}),state:()=>state};})();'
          Path("game-test.js").write_text(g)
          h=Path("index.html").read_text().replace("game.js?v=mobile-touch-20261001","game-test.js")
          test=r'''<script>(async()=>{const out=[],err=[];window.addEventListener("error",e=>err.push((e.error&&e.error.stack)||e.message));const sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=id=>{let e=document.getElementById(id);e.focus();e.click()};try{
            await sleep(80);click("opening");await sleep(20);click("playBtn");await sleep(20);click("introBtn");await sleep(20);if(document.getElementById("tutorial").classList.contains("active"))click("tutorialBtn");await sleep(60);
            out.push("start="+(__TEST__.state()==="playing"));
            let a=__TEST__.pos();window.dispatchEvent(new KeyboardEvent("keydown",{key:"d",bubbles:true}));__TEST__.step(.2);window.dispatchEvent(new KeyboardEvent("keyup",{key:"d",bubbles:true}));let b=__TEST__.pos();out.push("pcMove="+(b.x>a.x));
            document.body.classList.add("touch-capable");let base=document.getElementById("joystickBase"),r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
            base.dispatchEvent(new PointerEvent("pointerdown",{pointerId:11,clientX:cx+30,clientY:cy-30,bubbles:true}));base.dispatchEvent(new PointerEvent("pointermove",{pointerId:11,clientX:cx+35,clientY:cy-35,bubbles:true}));let t=__TEST__.touch();out.push("diagonal="+(t.moveX>0&&t.moveY<0));
            let run=document.getElementById("touchRun");run.dispatchEvent(new PointerEvent("pointerdown",{pointerId:12,bubbles:true}));out.push("multitouchRun="+__TEST__.touch().run);
            a=__TEST__.pos();__TEST__.step(.2);b=__TEST__.pos();out.push("touchMove="+(b.x>a.x&&b.y<a.y));
            let act=document.getElementById("touchInteract");act.dispatchEvent(new PointerEvent("pointerdown",{pointerId:13,bubbles:true}));out.push("interactDown="+__TEST__.keys().e);act.dispatchEvent(new PointerEvent("pointercancel",{pointerId:13,bubbles:true}));out.push("interactCancel="+!__TEST__.keys().e);
            run.dispatchEvent(new PointerEvent("pointercancel",{pointerId:12,bubbles:true}));base.dispatchEvent(new PointerEvent("pointercancel",{pointerId:11,bubbles:true}));t=__TEST__.touch();out.push("cancelStops="+(!t.run&&t.moveX===0&&t.moveY===0));
            a=__TEST__.pos();__TEST__.step(.2);b=__TEST__.pos();out.push("noGhostMove="+(a.x===b.x&&a.y===b.y));
          }catch(e){err.push(e.stack||String(e))}
          const need=["start=true","pcMove=true","diagonal=true","multitouchRun=true","touchMove=true","interactDown=true","interactCancel=true","cancelStops=true","noGhostMove=true"];let pass=need.every(x=>out.includes(x))&&!err.length;document.body.dataset.test=pass?"PASS":"FAIL";let p=document.createElement("pre");p.id="result";p.textContent=JSON.stringify({out,err},null,2);document.body.appendChild(p)})();</script>'''
          Path("browser-test.html").write_text(h.replace("</body>",test+"</body>"))
      - name: Run Chromium gameplay input regression
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          sleep 1
          timeout 25s chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1800 --dump-dom http://127.0.0.1:8765/browser-test.html >/tmp/dom.txt 2>/tmp/chrome.err || true
          grep -A30 '<pre id="result">' /tmp/dom.txt || true
          grep -q 'data-test="PASS"' /tmp/dom.txt
