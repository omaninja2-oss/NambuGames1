name: Startup browser regression
on:
  push:
    branches: [main]
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build browser scenarios
        shell: python
        run: |
          from pathlib import Path
          game=Path("game.js").read_text()
          game=game.rsplit("})();",1)[0]+'window.__START_TEST__={pos:()=>pl?{x:pl.x,y:pl.y}:null,state:()=>state,forceGameOver:()=>{state="gameOver";show("gameOver")},step:dt=>update(dt)};})();'
          Path("game-start-test.js").write_text(game)
          base=Path("index.html").read_text().replace("game.js?v=start-focus-fix-20261001","game-start-test.js")
          harness=r'''<script>(async()=>{const out=[],err=[];window.addEventListener("error",e=>err.push((e.error&&e.error.stack)||e.message));const sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=id=>{const e=document.getElementById(id);if(!e)throw new Error("missing #"+id);e.focus();e.click()};try{await sleep(100);click("opening");await sleep(30);click("playBtn");out.push("playBtn");await sleep(30);click("introBtn");out.push("introBtn");await sleep(30);if(document.getElementById("tutorial").classList.contains("active")){click("tutorialBtn");out.push("tutorialBtn")}await sleep(180);out.push("gameActive="+document.getElementById("game").classList.contains("active"));const a=window.__START_TEST__.pos();window.dispatchEvent(new KeyboardEvent("keydown",{key:"d",bubbles:true}));window.__START_TEST__.step(.2);await sleep(20);window.dispatchEvent(new KeyboardEvent("keyup",{key:"d",bubbles:true}));await sleep(50);const b=window.__START_TEST__.pos();out.push("playerMoved="+!!(a&&b&&(a.x!==b.x||a.y!==b.y)))}catch(e){err.push(e.stack||String(e))}const pass=out.includes("gameActive=true")&&out.includes("playerMoved=true")&&!err.length;document.body.dataset.test=pass?"PASS":"FAIL";const pre=document.createElement("pre");pre.id="browserTestResult";pre.textContent=JSON.stringify({out,err},null,2);document.body.appendChild(pre)})();</script>'''
          scenarios={"clean":None,"tutorial":'{"version":"1.0","tutorial":true,"unlocked":1,"stars":[0,0,0],"achievements":[]}',"legacy":'{"tutorial":true,"unlocked":3,"stars":[3,2],"music":true,"sfx":true,"volume":0.7,"plays":17,"tasksDone":41,"bestScore":2200}'}
          for name,save in scenarios.items():
            s=base
            if save is not None:
              s=s.replace('<script src="game-start-test.js','<script>localStorage.setItem("cqmtvSave",'+repr(save)+');</script><script src="game-start-test.js')
            Path("startup-"+name+".html").write_text(s.replace("</body>",harness+"</body>"))
      - name: Run Chromium startup scenarios
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          sleep 1
          for scenario in clean tutorial legacy; do
            runs=1; [ "$scenario" = clean ] && runs=5
            for n in $(seq 1 $runs); do
              timeout 20s chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/startup-$scenario.html?run=$n" > "/tmp/$scenario-$n.txt" 2>/dev/null || true
              echo "SCENARIO=$scenario RUN=$n"
              grep -A20 'browserTestResult' "/tmp/$scenario-$n.txt" || true
              grep -q 'data-test="PASS"' "/tmp/$scenario-$n.txt"
            done
          done
      - name: Verify published Pages asset
        run: |
          expected='game.js?v=start-focus-fix-20261001'
          for n in $(seq 1 12); do
            body="$(curl -fsSL "https://omaninja2-oss.github.io/NambuGames1/?cb=$GITHUB_SHA" || true)"
            if echo "$body" | grep -q "$expected"; then echo "PAGES_ASSET_OK=$expected"; exit 0; fi
            echo "Waiting for Pages deployment ($n/12)"; sleep 10
          done
          exit 1
