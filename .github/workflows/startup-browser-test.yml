name: Startup browser regression
on:
  push:
    branches: [main]
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build browser scenarios
        shell: python
        run: |
          from pathlib import Path
          game=Path("game.js").read_text()
          game=game.rsplit("})();",1)[0]+'window.__START_TEST__={fail:()=>fail(),pos:()=>pl?{x:pl.x,y:pl.y}:null,state:()=>state};})();'
          Path("game-start-test.js").write_text(game)
          base=Path("index.html").read_text().replace("game.js?v=start-debug-fix-2-20260930","game-start-test.js")
          harness=r'''<script>(async()=>{const out=[],err=[];window.addEventListener("error",e=>err.push((e.error&&e.error.stack)||e.message));window.addEventListener("unhandledrejection",e=>err.push(String(e.reason)));const sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=id=>{const e=document.getElementById(id);if(!e)throw new Error("missing #"+id);e.click()},start=async()=>{click("playBtn");await sleep(20);click("introBtn");await sleep(20);if(document.getElementById("tutorial").classList.contains("active")){click("tutorialBtn");await sleep(20)}await sleep(120);if(!document.getElementById("game").classList.contains("active"))throw new Error("game not active");const before=window.__START_TEST__.pos();window.dispatchEvent(new KeyboardEvent("keydown",{key:"d",bubbles:true}));await sleep(180);window.dispatchEvent(new KeyboardEvent("keyup",{key:"d",bubbles:true}));await sleep(30);const after=window.__START_TEST__.pos();if(!before||!after||(before.x===after.x&&before.y===after.y))throw new Error("player did not move")};try{await sleep(80);click("opening");await sleep(20);for(let i=1;i<=5;i++){await start();out.push("normal-start-"+i+"=PASS");window.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true}));await sleep(10);click("pauseMenuBtn");await sleep(20)}await start();window.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true}));await sleep(10);click("restartPauseBtn");await sleep(20);click("introBtn");await sleep(20);if(document.getElementById("tutorial").classList.contains("active"))click("tutorialBtn");await sleep(120);if(!document.getElementById("game").classList.contains("active"))throw new Error("restart failed");out.push("restart=PASS");window.__START_TEST__.fail();await sleep(3800);if(!document.getElementById("gameOver").classList.contains("active"))throw new Error("game over not reached");click("retryBtn");await sleep(20);click("introBtn");await sleep(20);if(document.getElementById("tutorial").classList.contains("active"))click("tutorialBtn");await sleep(120);if(!document.getElementById("game").classList.contains("active"))throw new Error("game over retry failed");out.push("gameover-retry=PASS")}catch(e){err.push(e.stack||String(e))}const pass=out.includes("normal-start-5=PASS")&&out.includes("restart=PASS")&&out.includes("gameover-retry=PASS")&&!err.length;document.body.dataset.test=pass?"PASS":"FAIL";const pre=document.createElement("pre");pre.id="browserTestResult";pre.textContent=JSON.stringify({out,err},null,2);document.body.appendChild(pre)})();</script>'''
          scenarios={"clean":None,"tutorial":'{"version":"1.0","tutorial":true,"unlocked":1,"stars":[0,0,0],"achievements":[]}',"legacy":'{"tutorial":true,"unlocked":3,"stars":[3,2],"music":true,"sfx":true,"volume":0.7,"plays":17,"tasksDone":41,"bestScore":2200}'}
          for name,save in scenarios.items():
            s=base
            if save is not None:
              s=s.replace('<script src="game-start-test.js','<script>localStorage.setItem("cqmtvSave",'+repr(save)+');</script><script src="game-start-test.js')
            Path("startup-"+name+".html").write_text(s.replace("</body>",harness+"</body>"))
      - name: Run Chromium startup scenarios
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          sleep 1
          for scenario in clean tutorial legacy; do
            timeout 25s chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "http://127.0.0.1:8765/startup-$scenario.html" > "/tmp/$scenario.txt" 2>/dev/null || true
            echo "SCENARIO=$scenario"
            grep -A30 'browserTestResult' "/tmp/$scenario.txt" || true
            grep -q 'data-test="PASS"' "/tmp/$scenario.txt"
          done
      - name: Verify published Pages asset
        run: |
          expected='game.js?v=start-debug-fix-2-20260930'
          for n in $(seq 1 12); do
            body="$(curl -fsSL "https://omaninja2-oss.github.io/NambuGames1/?cb=$GITHUB_SHA" || true)"
            if echo "$body" | grep -q "$expected"; then echo "PAGES_ASSET_OK=$expected"; exit 0; fi
            echo "Waiting for Pages deployment ($n/12)"; sleep 10
          done
          exit 1
